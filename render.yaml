services:
  - type: web
    name: n8n-tiktok
    env: docker
    dockerfilePath: ./Dockerfile
    
    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: N8N_HOST
        fromService:
          name: n8n-tiktok
          property: host
      - key: N8N_PORT
        value: 5678
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_SECURE_COOKIE
        value: "true"
      - key: WEBHOOK_TUNNEL_URL
        fromService:
          name: n8n-tiktok
          property: url
      - key: GENERIC_TIMEZONE
        value: UTC
      
    # Resource allocation
    plan: free
    
    # Auto-redeploy on push
    autoDeploy: true
